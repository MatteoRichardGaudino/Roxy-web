<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Roxy Access</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="80x80" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #000000;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    .gate-card {
      width: 100%;
      max-width: 400px;
      background: rgba(14, 14, 22, 0.9);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 20px;
      padding: 36px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(99, 102, 241, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
    }
    .gate-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #6366f1, #312e81);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.35);
    }
    .gate-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
    }
    .gate-desc {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.5;
    }
    .gate-input-wrap {
      width: 100%;
    }
    .gate-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-size: 1.05rem;
      color: #ffffff;
      outline: none;
      text-align: center;
      letter-spacing: 2px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .gate-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.4);
    }
    .btn-unlock {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      border: none;
      font-size: 1.02rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
      transition: transform 0.15s, filter 0.15s;
    }
    .btn-unlock:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-unlock:active {
      transform: translateY(0);
    }
    .gate-error {
      color: #f87171;
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
    }
    .gate-loading {
      color: #a5b4fc;
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
    }
  </style>
</head>

  <script>
    (function() {
      const STORAGE_KEY = 'roxy_vip_pass';
      const passInput = document.getElementById('gate-pass-input');
      const unlockBtn = document.getElementById('btn-gate-unlock');
      const errorMsg = document.getElementById('gate-error-msg');
      const loadingMsg = document.getElementById('gate-loading-msg');
      const gateCard = document.getElementById('gate-card');

      function base64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      async function decryptPayload(password, payload) {
        if (!window.crypto || !window.crypto.subtle) {
          throw new Error('WebCrypto API non supportata o HTTPS richiesto.');
        }
        const salt = base64ToBytes(payload.salt);
        const iv = base64ToBytes(payload.iv);
        const ciphertext = base64ToBytes(payload.data);

        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          'raw', enc.encode(password.trim()), { name: 'PBKDF2' }, false, ['deriveKey']
        );
        const key = await window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        const decrypted = await window.crypto.subtle.decrypt(
          { name: 'AES-GCM', iv }, key, ciphertext
        );
        return new TextDecoder().decode(decrypted);
      }

      async function attemptUnlock(pwd, isAuto) {
        if (!pwd || !pwd.trim()) return;
        const trimmed = pwd.trim();
        const payloadEl = document.getElementById('roxy-encrypted-payload');
        if (!payloadEl) return;
        let payload = null;
        try { payload = JSON.parse(payloadEl.textContent); } catch (e) { return; }

        if (!isAuto) {
          unlockBtn.disabled = true;
          errorMsg.style.display = 'none';
          loadingMsg.style.display = 'block';
        }

        try {
          const decryptedHtml = await decryptPayload(trimmed, payload);
          localStorage.setItem(STORAGE_KEY, trimmed);

          // Clean Gatekeeper UI and mount full portal safely
          const parser = new DOMParser();
          const doc = parser.parseFromString(decryptedHtml, 'text/html');

          // Replace head contents (titles, styles, links)
          document.head.innerHTML = doc.head.innerHTML;

          // Replace body contents
          document.body.innerHTML = doc.body.innerHTML;

          // Execute scripts in doc
          const scripts = doc.querySelectorAll('script');
          scripts.forEach(s => {
            const newScript = document.createElement('script');
            if (s.src) {
              newScript.src = s.src;
            } else {
              newScript.textContent = s.textContent;
            }
            document.body.appendChild(newScript);
          });
        } catch (err) {
          localStorage.removeItem(STORAGE_KEY);
          if (!isAuto) {
            loadingMsg.style.display = 'none';
            errorMsg.style.display = 'block';
            unlockBtn.disabled = false;
            passInput.focus();
            passInput.select();
          } else {
            gateCard.style.display = 'flex';
          }
        }
      }

      if (unlockBtn) {
        unlockBtn.addEventListener('click', () => attemptUnlock(passInput.value, false));
      }
      if (passInput) {
        passInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') attemptUnlock(passInput.value, false);
        });
      }

      // Auto-unlock from localStorage cache
      const cachedKey = localStorage.getItem(STORAGE_KEY);
      if (cachedKey) {
        gateCard.style.display = 'none';
        attemptUnlock(cachedKey, true);
      }
    })();
  </script>
